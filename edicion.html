<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Edición (Foto y Video) — MoncadaArt</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --radius: 16px;
      --accent: #8ab4ff;
      --accent2: #55ffe1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Poppins, system-ui, sans-serif;
    }

    body {
      transition: background .4s, color .4s;
    }

    body.dark {
      --bg: #0b0e13;
      --card: #11151c;
      --soft: #1c2230;
      --ink: #eaf0ff;
      --muted: #b1b8cc;

      background: var(--bg);
      color: var(--ink);
    }

    body.light {
      --bg: #f5f6fb;
      --card: #ffffff;
      --soft: #e9eef4;
      --ink: #0f1222;
      --muted: #5a6275;

      background: var(--bg);
      color: var(--ink);
    }

    /* =========================
       HERO
       ========================= */

    header.hero {
      position: relative;
      min-height: 36vh;
      display: grid;
      place-items: end center;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .hero .cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.6);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, .45),
          rgba(11, 14, 19, .95)
        );
    }

    .perfil {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .18);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    body.light .perfil {
      background: rgba(255, 255, 255, .85);
      border: 1px solid rgba(0, 0, 0, .1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, .15);
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, .2);
    }

    .info h1 {
      margin: 0;
      font-size: clamp(22px, 3.6vw, 38px);
    }

    .info p {
      margin: .2rem 0 0;
      color: var(--muted);
    }

    /* =========================
       MAIN
       MÁS ANCHO
       ========================= */

    main {
      width: min(1600px, 98vw);
      margin: 26px auto;
      padding: 0 16px;
    }

    /* =========================
       BUSCADOR
       ========================= */

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 18px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--soft);
      border: 1px solid rgba(255, 255, 255, .08);
      padding: 10px 12px;
      border-radius: 12px;
      min-width: 280px;
    }

    body.light .search {
      border: 1px solid #e7e9f3;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .1);
    }

    .search input {
      all: unset;
      width: 100%;
    }

    /* =========================
       GRID
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width: 950px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        width: 100%;
      }

      .search {
        width: 100%;
        min-width: 0;
      }
    }

    /* =========================
       TARJETAS
       ========================= */

    .card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: var(--radius);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, .35);
    }

    .poster {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      object-position: center;
      background: #0f1a24;
      flex-shrink: 0;
    }

    .static-video {
      pointer-events: none;
    }

    .titleWrap {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* =========================
       CATEGORÍA
       ========================= */

    .category {
      display: inline-block;
      width: max-content;
      max-width: 100%;
      margin-bottom: 8px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #0a0f16;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );
    }

    /* =========================
       TÍTULO
       ========================= */

    .title {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.3;
      margin: 0 0 7px;
      min-height: 39px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       DESCRIPCIÓN
       ========================= */

    .desc {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      margin: 0 0 12px;
      min-height: 54px;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       BOTONES
       ========================= */

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 10px;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );
      color: #0a0f16;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    /* =========================
       MODAL
       ========================= */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .62);
      backdrop-filter: blur(7px);
      z-index: 50;
    }

    .modal.open {
      display: grid;
    }

    .modal .box {
      width: min(1000px, 94vw);
      max-height: min(88vh, 1000px);
      border-radius: 20px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
      display: flex;
      flex-direction: column;
    }

    .proj-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .10);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 2;
    }

    .proj-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .close-btn {
      all: unset;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      flex-shrink: 0;
    }

    body.light .close-btn {
      background: #edf0f5;
      border-color: #dde1ea;
    }

    /* =========================
       CONTENIDO DEL MODAL
       ========================= */

    .proj {
      display: grid;
      grid-template-columns:
        minmax(0, 1.3fr)
        minmax(240px, .7fr);

      gap: 18px;
      padding: 18px;
      overflow: auto;
    }

    @media (max-width: 800px) {
      .proj {
        grid-template-columns: 1fr;
      }
    }

    .modal-media {
      min-width: 0;
    }

    .proj-hero {
      display: block;
      width: 100%;
      background: #0f1a24;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    }

    iframe.proj-hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 300px;
    }

    video.proj-hero {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    img.proj-hero {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    .modal-info {
      min-width: 0;
    }

    .project-meta {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-item {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: var(--soft);
      font-size: 12px;
      color: var(--muted);
    }

    .proj-sub {
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header class="hero">

    <img
      class="cover"
      src="assets/img/portada.jpeg"
      alt="Portada"
    >

    <div class="overlay"></div>

    <div class="perfil">

      <img
        class="avatar"
        src="assets/img/perfil.jpeg"
        alt="Perfil"
      >

      <div class="info">
        <h1>Edición (Foto y Video)</h1>
        <p>Color, ritmo, motion y narrativa visual.</p>
      </div>

    </div>

  </header>

  <main>

    <div class="toolbar">

      <div class="search">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="M20 20L16.5 16.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>

        <input
          id="q"
          placeholder="Buscar proyecto, empresa o categoría..."
          aria-label="Buscar proyectos"
        >

      </div>

    </div>

    <section
      id="grid"
      class="grid"
    ></section>

  </main>

  <div
    id="modal"
    class="modal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
  >

    <div
      class="box"
      id="modalBox"
    >

      <div class="proj-head">

        <h2
          class="proj-title"
          id="projTitle"
        >
          Proyecto
        </h2>

        <button
          class="close-btn"
          id="closeBtn"
          aria-label="Cerrar"
        >
          ✕
        </button>

      </div>

      <div
        class="proj"
        id="modalContent"
      ></div>

    </div>

  </div>

  <script>

    function setMode() {
      const hour = new Date().getHours();

      document.body.className =
        (hour >= 7 && hour < 19)
          ? "light"
          : "dark";
    }

    setMode();


    const GRID =
      document.getElementById("grid");

    const Q =
      document.getElementById("q");

    const MODAL =
      document.getElementById("modal");

    const MODAL_TITLE =
      document.getElementById("projTitle");

    const MODAL_CONTENT =
      document.getElementById("modalContent");

    const CLOSE_BTN =
      document.getElementById("closeBtn");


    let projects = [];
    let visibleProjects = [];


    function escapeHTML(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function placeholder(title = "Proyecto") {

      const safeTitle =
        String(title)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="800"
          height="450"
        >
          <defs>
            <linearGradient
              id="gradient"
              x1="0"
              x2="1"
            >
              <stop
                offset="0%"
                stop-color="#1c2230"
              />

              <stop
                offset="100%"
                stop-color="#0f1a24"
              />
            </linearGradient>
          </defs>

          <rect
            width="100%"
            height="100%"
            fill="url(#gradient)"
          />

          <text
            x="50%"
            y="50%"
            fill="#87a7ff"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Poppins"
            font-size="25"
            font-weight="bold"
          >
            ${safeTitle}
          </text>
        </svg>
      `;

      return (
        "data:image/svg+xml," +
        encodeURIComponent(svg)
      );
    }


    function getYouTubeID(url = "") {

      try {

        if (!url) {
          return "";
        }

        const parsedURL =
          new URL(url);

        const hostname =
          parsedURL.hostname
            .replace(/^www\./, "");


        if (
          (
            hostname === "youtube.com" ||
            hostname === "m.youtube.com"
          ) &&
          parsedURL.pathname === "/watch"
        ) {

          return (
            parsedURL
              .searchParams
              .get("v")
            || ""
          );
        }


        if (
          hostname === "youtu.be"
        ) {

          return (
            parsedURL.pathname
              .replace("/", "")
              .split("/")[0]
            || ""
          );
        }


        if (
          hostname === "youtube.com" &&
          parsedURL.pathname.startsWith(
            "/shorts/"
          )
        ) {

          return (
            parsedURL.pathname
              .split("/")[2]
            || ""
          );
        }


        if (
          hostname === "youtube.com" &&
          parsedURL.pathname.startsWith(
            "/embed/"
          )
        ) {

          return (
            parsedURL.pathname
              .split("/")[2]
            || ""
          );
        }

      } catch (error) {

        console.error(
          "Error leyendo URL de YouTube:",
          url,
          error
        );
      }

      return "";
    }


    function getYouTubeThumbnail(
      url = ""
    ) {

      const id =
        getYouTubeID(url);

      if (!id) {
        return "";
      }

      return (
        "https://i.ytimg.com/vi/" +
        id +
        "/maxresdefault.jpg"
      );
    }


    function getYouTubeThumbnailFallback(
      url = ""
    ) {

      const id =
        getYouTubeID(url);

      if (!id) {
        return "";
      }

      return (
        "https://i.ytimg.com/vi/" +
        id +
        "/hqdefault.jpg"
      );
    }


    function render(list) {

      visibleProjects = list;


      if (!list.length) {

        GRID.innerHTML = `
          <p
            style="
              color:var(--muted);
              text-align:center;
              grid-column:1/-1;
              padding:30px;
            "
          >
            No se encontraron proyectos.
          </p>
        `;

        return;
      }


      GRID.innerHTML =
        list
          .map(
            (project, index) => {

              const title =
                escapeHTML(
                  project.title ||
                  "Proyecto"
                );

              const description =
                escapeHTML(
                  project.desc ||
                  ""
                );

              const category =
                escapeHTML(
                  project.categoria ||
                  "Edición"
                );

              const youtubeID =
                getYouTubeID(
                  project.video || ""
                );

              let cardMedia = "";


              if (youtubeID) {

                const thumbnail =
                  getYouTubeThumbnail(
                    project.video
                  );

                const fallback =
                  getYouTubeThumbnailFallback(
                    project.video
                  );

                cardMedia = `
                  <img
                    class="poster youtube-thumb"
                    src="${escapeHTML(thumbnail)}"
                    alt="${title}"
                    loading="lazy"
                    data-hq="${escapeHTML(fallback)}"
                    data-placeholder="${escapeHTML(
                      placeholder(
                        project.title
                      )
                    )}"
                  >
                `;

              } else if (
                project.cover
              ) {

                cardMedia = `
                  <img
                    class="poster normal-cover"
                    src="${escapeHTML(
                      project.cover
                    )}"
                    alt="${title}"
                    loading="lazy"
                    data-placeholder="${escapeHTML(
                      placeholder(
                        project.title
                      )
                    )}"
                  >
                `;

              } else if (
                project.video &&
                /\.(mp4|webm|mov)$/i.test(
                  project.video
                )
              ) {

                cardMedia = `
                  <video
                    class="poster static-video"
                    src="${escapeHTML(
                      project.video
                    )}"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>
                `;

              } else {

                cardMedia = `
                  <img
                    class="poster"
                    src="${placeholder(
                      project.title
                    )}"
                    alt="${title}"
                  >
                `;
              }


              return `
                <article class="card">

                  ${cardMedia}

                  <div class="titleWrap">

                    <span class="category">
                      ${category}
                    </span>

                    <h3 class="title">
                      ${title}
                    </h3>

                    <p class="desc">
                      ${description}
                    </p>

                    <div class="btns">

                      <a
                        href="#"
                        class="btn"
                        data-i="${index}"
                      >
                        Ver proyecto
                      </a>

                    </div>

                  </div>

                </article>
              `;
            }
          )
          .join("");


      GRID
        .querySelectorAll(
          ".youtube-thumb"
        )
        .forEach(
          image => {

            let fallbackStep = 0;

            image.addEventListener(
              "error",
              () => {

                if (
                  fallbackStep === 0 &&
                  image.dataset.hq
                ) {

                  fallbackStep = 1;
                  image.src = image.dataset.hq;
                  return;
                }

                if (
                  fallbackStep === 1 &&
                  image.dataset.placeholder
                ) {

                  fallbackStep = 2;
                  image.src =
                    image.dataset.placeholder;
                }

              }
            );

          }
        );


      GRID
        .querySelectorAll(
          ".normal-cover"
        )
        .forEach(
          image => {

            image.addEventListener(
              "error",
              () => {

                if (
                  image.dataset.placeholder
                ) {

                  image.src =
                    image.dataset.placeholder;
                }

              },
              {
                once: true
              }
            );

          }
        );


      GRID
        .querySelectorAll(
          ".static-video"
        )
        .forEach(
          video => {

            const setFrame =
              () => {

                try {

                  if (
                    Number.isFinite(
                      video.duration
                    ) &&
                    video.duration > 0
                  ) {

                    video.currentTime =
                      Math.min(
                        3,
                        video.duration / 2
                      );
                  }

                  video.pause();

                } catch (error) {

                  console.error(
                    "No se pudo usar frame de video:",
                    error
                  );
                }

              };


            if (
              video.readyState >= 1
            ) {

              setFrame();

            } else {

              video.addEventListener(
                "loadedmetadata",
                setFrame,
                {
                  once: true
                }
              );
            }

          }
        );
    }


    Q.addEventListener(
      "input",
      () => {

        const search =
          Q.value
            .trim()
            .toLowerCase();

        if (!search) {

          render(
            projects
          );

          return;
        }

        const result =
          projects.filter(
            project => {

              const searchable =
                [
                  project.title,
                  project.desc,
                  project.categoria,
                  project.empresa
                ]
                  .filter(Boolean)
                  .join(" ")
                  .toLowerCase();

              return searchable.includes(
                search
              );
            }
          );

        render(result);
      }
    );


    function openModalFor(
      project
    ) {

      if (!project) {
        return;
      }

      MODAL_TITLE.textContent =
        project.title ||
        "Proyecto";

      const videoURL =
        String(
          project.video || ""
        );

      const youtubeID =
        getYouTubeID(
          videoURL
        );

      let mediaHTML = "";


      if (youtubeID) {

        mediaHTML = `
          <iframe
            class="proj-hero"
            src="https://www.youtube.com/embed/${escapeHTML(
              youtubeID
            )}?rel=0"
            title="${escapeHTML(
              project.title ||
              "Proyecto"
            )}"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share
            "
            allowfullscreen
          ></iframe>
        `;

      } else if (
        /\.(mp4|webm|mov)$/i.test(
          videoURL
        )
      ) {

        mediaHTML = `
          <video
            class="proj-hero"
            src="${escapeHTML(
              videoURL
            )}"
            controls
            preload="metadata"
            playsinline
          ></video>
        `;

      } else if (
        project.cover
      ) {

        mediaHTML = `
          <img
            class="proj-hero"
            src="${escapeHTML(
              project.cover
            )}"
            alt="${escapeHTML(
              project.title ||
              "Proyecto"
            )}"
          >
        `;

      } else {

        mediaHTML = `
          <img
            class="proj-hero"
            src="${placeholder(
              project.title ||
              "Proyecto"
            )}"
            alt="${escapeHTML(
              project.title ||
              "Proyecto"
            )}"
          >
        `;
      }


      const hasVideo =
        Boolean(
          youtubeID ||
          /\.(mp4|webm|mov)$/i.test(
            videoURL
          )
        );


      if (
        !hasVideo &&
        Array.isArray(
          project.gallery
        ) &&
        project.gallery.length
      ) {

        project.gallery.forEach(
          image => {

            mediaHTML += `
              <img
                class="proj-hero"
                src="${escapeHTML(
                  image
                )}"
                alt="Vista de ${escapeHTML(
                  project.title ||
                  "Proyecto"
                )}"
                style="margin-top:10px;"
              >
            `;

          }
        );
      }


      let metaHTML = "";


      if (
        project.categoria
      ) {

        metaHTML += `
          <span class="meta-item">
            ${escapeHTML(
              project.categoria
            )}
          </span>
        `;
      }


      if (
        project.empresa
      ) {

        metaHTML += `
          <span class="meta-item">
            ${escapeHTML(
              project.empresa
            )}
          </span>
        `;
      }


      MODAL_CONTENT.innerHTML = `

        <div class="modal-media">

          ${mediaHTML}

        </div>

        <div class="modal-info">

          <div class="project-meta">

            ${metaHTML}

          </div>

          <h3>
            Descripción
          </h3>

          <p class="proj-sub">

            ${escapeHTML(
              project.desc ||
              "Sin descripción."
            )}

          </p>

        </div>
      `;


      MODAL.classList.add(
        "open"
      );

      MODAL.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";

      CLOSE_BTN.focus();
    }


    function closeModal() {

      MODAL
        .querySelectorAll(
          "video"
        )
        .forEach(
          video => {

            video.pause();

          }
        );

      MODAL_CONTENT.innerHTML =
        "";

      MODAL.classList.remove(
        "open"
      );

      MODAL.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";
    }


    GRID.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "[data-i]"
          );

        if (!button) {
          return;
        }

        event.preventDefault();

        const index =
          Number(
            button.dataset.i
          );

        openModalFor(
          visibleProjects[
            index
          ]
        );
      }
    );


    CLOSE_BTN.addEventListener(
      "click",
      closeModal
    );


    MODAL.addEventListener(
      "click",
      event => {

        if (
          event.target === MODAL
        ) {

          closeModal();
        }
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          MODAL.classList.contains(
            "open"
          )
        ) {

          closeModal();
        }
      }
    );


    async function load() {

      try {

        const response =
          await fetch(
            "Edicion/manifest.json?v=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {

          throw new Error(
            `Error HTTP: ${
              response.status
            }`
          );
        }

        const data =
          await response.json();

        projects =
          Array.isArray(
            data.projects
          )
            ? data.projects
            : [];

        render(
          projects
        );

      } catch (error) {

        console.error(
          "Error cargando Edicion/manifest.json:",
          error
        );

        projects = [];

        GRID.innerHTML = `
          <p
            style="
              color:var(--muted);
              text-align:center;
              grid-column:1/-1;
              padding:30px;
            "
          >
            No fue posible cargar los proyectos.
          </p>
        `;
      }
    }


    load();

  </script>

</body>
</html>
